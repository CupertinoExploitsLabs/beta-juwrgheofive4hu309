name: Build NOCTURNE unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nocturne-ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS app and package IPA
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Validate project files and shared scheme
        shell: bash
        run: |
          set -euo pipefail
          test -f Nocturne.xcodeproj/project.pbxproj
          test -f Nocturne.xcodeproj/xcshareddata/xcschemes/Nocturne.xcscheme
          test -f Nocturne/NocturneApp.swift
          test -f Nocturne/ContentView.swift
          echo '--- Xcode project targets and schemes ---'
          xcodebuild -list -project Nocturne.xcodeproj

      - name: Build for generic iOS device
        shell: bash
        run: |
          set -euo pipefail
          DERIVED_DATA="$RUNNER_TEMP/NocturneDerived"
          RESULT_BUNDLE="$RUNNER_TEMP/NocturneBuild.xcresult"
          LOG_FILE="$RUNNER_TEMP/nocturne-xcodebuild.log"
          set +e
          xcodebuild \
            -project Nocturne.xcodeproj \
            -scheme Nocturne \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULT_BUNDLE" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$LOG_FILE"
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "xcodebuild failed with exit code $BUILD_STATUS"
            exit "$BUILD_STATUS"
          fi

      - name: Package and verify unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/NocturneDerived/Build/Products/Release-iphoneos/Nocturne.app"
          IPA="$GITHUB_WORKSPACE/Nocturne-unsigned.ipa"
          test -d "$APP"
          test -s "$APP/Info.plist"
          mkdir -p "$RUNNER_TEMP/NocturneIPA/Payload"
          ditto "$APP" "$RUNNER_TEMP/NocturneIPA/Payload/Nocturne.app"
          cd "$RUNNER_TEMP/NocturneIPA"
          /usr/bin/zip -qry "$IPA" Payload
          /usr/bin/unzip -t "$IPA"
          test -s "$IPA"
          echo "Created unsigned IPA: $IPA"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Nocturne-unsigned-ipa
          path: Nocturne-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Nocturne-build-diagnostics
          path: |
            ${{ runner.temp }}/nocturne-xcodebuild.log
            ${{ runner.temp }}/NocturneBuild.xcresult
          if-no-files-found: ignore
          retention-days: 7
