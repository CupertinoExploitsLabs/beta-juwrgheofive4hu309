name: Build NOCTURNE unsigned IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build
        run: |
          xcodebuild -project Nocturne.xcodeproj -target Nocturne \
            -sdk iphoneos -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/NocturneDerived" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          APP="$RUNNER_TEMP/NocturneDerived/Build/Products/Release-iphoneos/Nocturne.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/Nocturne.app"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$GITHUB_WORKSPACE/Nocturne-unsigned.ipa" Payload
          unzip -t "$GITHUB_WORKSPACE/Nocturne-unsigned.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: Nocturne-unsigned-ipa
          path: Nocturne-unsigned.ipa
          if-no-files-found: error
